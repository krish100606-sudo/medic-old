spring.application.name=Health_Data_Management

# =========================================================
# AI PATIENT CASE-TAKING SOFTWARE
# Application Configuration
# =========================================================


# ---------------------------------------------------------
# SERVER
# ---------------------------------------------------------

server.port=${PORT:8083}


# ---------------------------------------------------------
# POSTGRESQL DATABASE (HIBERNATE JPA)
# ---------------------------------------------------------

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/health_data}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:krish}
spring.datasource.password=@@dhy@singh03
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------
# JPA / HIBERNATE
# ---------------------------------------------------------

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ---------------------------------------------------------
# JSP VIEW RESOLVER
# ---------------------------------------------------------

spring.mvc.view.prefix=/WEB-INF/jsp/

spring.mvc.view.suffix=.jsp


# ---------------------------------------------------------
# FILE UPLOAD
# ---------------------------------------------------------

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=20MB


# ---------------------------------------------------------
# FILE STORAGE
# ---------------------------------------------------------

file.upload-dir=uploads


# ---------------------------------------------------------
# LOGGING
# ---------------------------------------------------------

logging.level.org.springframework.web=INFO

logging.level.org.hibernate.SQL=INFO

logging.level.com.patientcase=DEBUG




# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:MyPatientCaseManagementSecretKey2026Secure}





# =========================================================
# ERROR HANDLING
# =========================================================

server.error.include-message=always

server.error.include-binding-errors=always

# =========================================================
# GEMINI AI & ML CONFIGURATION
# =========================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

